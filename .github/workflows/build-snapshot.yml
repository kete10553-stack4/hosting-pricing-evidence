name: Build evidence snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the public source export
        run: curl --fail --location --silent --show-error https://raw.githubusercontent.com/kete10553-stack4/HostDealRadar-promo-radar/main/data/offers.json --output /tmp/offers.json
      - name: Build and validate the dataset
        run: |
          python tools/build_snapshot.py /tmp/offers.json
          python tools/validate_dataset.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh evidence snapshot"
          git push
